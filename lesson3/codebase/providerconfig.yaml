apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: aws-localstack
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: creds
  endpoint:
    url:
      type: Static
      # TODO (student): point this at LocalStack as reachable FROM INSIDE the Kind cluster.
      # Hint: inside Kind, `localhost:4566` is the Kind node, NOT your laptop.
      # - Mac / Windows (Docker Desktop): http://host.docker.internal:4566
      # - Linux: use the Docker bridge IP, e.g. http://172.17.0.1:4566
      static: "FILL_ME_IN"
    services: [s3]
    hostnameImmutable: true

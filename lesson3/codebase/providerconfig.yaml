apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: aws-localstack
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: creds
  endpoint:
    url:
      type: Static
      # TODO (student): point this at LocalStack as reachable FROM INSIDE the Kind cluster.
      # Use the LocalStack-compatible S3 domain so virtual-hosted-style bucket URLs resolve:
      #   http://s3.localhost.localstack.cloud:4566
      # (setup.sh patches CoreDNS so *.s3.localhost.localstack.cloud → LocalStack container IP)
      static: "FILL_ME_IN"
    services: [s3]
    hostnameImmutable: true

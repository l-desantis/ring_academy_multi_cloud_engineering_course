# Answer for Mac / Windows (Docker Desktop). `host.docker.internal` is the
# Docker-provided DNS name that resolves to the host from inside containers.
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: aws-localstack
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: creds
  endpoint:
    url:
      type: Static
      static: http://host.docker.internal:4566
    services: [s3]
    hostnameImmutable: true

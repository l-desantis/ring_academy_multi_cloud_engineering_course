# Answer for Linux. `host.docker.internal` is typically NOT resolvable from a Kind
# node on Linux. Use the Docker bridge IP (default `172.17.0.1`) OR recreate the
# Kind cluster with `extraHosts` mapping host.docker.internal to the host IP.
# Verify yours with: `ip -4 addr show docker0 | grep inet`.
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: aws-localstack
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: creds
  endpoint:
    url:
      type: Static
      static: http://172.17.0.1:4566
    services: [s3]
    hostnameImmutable: true

apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: aws-localstack
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: creds
  endpoint:
    url:
      type: Static
      # s3.localhost.localstack.cloud is LocalStack's own domain for S3 virtual-hosted-style.
      # S3 prepends bucket names as subdomains (e.g. my-bucket.s3.localhost.localstack.cloud),
      # and LocalStack recognises this pattern to extract the bucket name correctly.
      # setup.sh patches CoreDNS so *.s3.localhost.localstack.cloud resolves to the
      # LocalStack container IP inside the Kind cluster.
      static: "http://s3.localhost.localstack.cloud:4566"
    services: [s3]
    hostnameImmutable: true
